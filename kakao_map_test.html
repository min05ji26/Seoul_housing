<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>카카오맵 테스트 — 서울살이</title>
<style>
  body { font-family: 'Pretendard', sans-serif; margin: 0; padding: 20px; background: #F8FAFC; }
  h1 { font-size: 20px; margin: 0 0 12px; }
  .sub { color: #6B7280; font-size: 13px; margin-bottom: 16px; }
  #map { width: 100%; height: 540px; border-radius: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); background:#E5E7EB; }
  .legend { margin-top: 12px; font-size: 13px; color: #4B5563; }
  .err { background: #FEE2E2; color: #991B1B; padding: 12px; border-radius: 8px; white-space: pre-wrap; font-family: monospace; font-size: 12px; }
  .ok  { background: #DCFCE7; color: #166534; padding: 8px 12px; border-radius: 8px; font-size: 12px; margin-bottom: 8px; }
  #diag { margin-bottom: 12px; font-size: 12px; color:#374151; background:#fff; padding:10px 12px; border-radius:8px; border:1px solid #E5E7EB; }
  code { background:#F3F4F6; padding:2px 6px; border-radius:4px; }
</style>
</head>
<body>

<h1>🗺️ 카카오맵 테스트</h1>
<div class="sub">진단 정보 → 도메인 등록 확인용</div>

<div id="diag">진단 중…</div>
<div id="status"></div>
<div id="map"></div>

<div class="legend">
  핀 클릭 → 동 이름·종합점수·가격 표시
</div>

<script>
  // ── 진단 정보 표시 ──────────────────────────
  const diag = document.getElementById('diag');
  diag.innerHTML =
    `현재 origin: <code>${location.origin || '(file://)'}</code><br>` +
    `현재 host  : <code>${location.host || '(없음)'}</code><br>` +
    `프로토콜    : <code>${location.protocol}</code><br>` +
    `→ 위 host를 카카오 디벨로퍼스 → 앱 → 플랫폼 → Web 사이트 도메인에 등록해야 합니다.`;

  // ── SDK 동적 로드 (autoload=false + load 콜백 패턴) ──
  const KEY = '287008c8a85abd65b7e5846af5d2bbab';
  const statusEl = document.getElementById('status');

  const s = document.createElement('script');
  s.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${KEY}&autoload=false`;
  s.onload = () => {
    statusEl.innerHTML = '<div class="ok">✅ SDK script 로드 성공 → 지도 초기화 시도</div>';
    if (!window.kakao || !window.kakao.maps) {
      statusEl.innerHTML += `<div class="err">❌ kakao.maps 객체가 없습니다.\n→ 키는 맞지만 도메인이 미등록일 가능성 높음.</div>`;
      return;
    }
    kakao.maps.load(initMap);
  };
  s.onerror = (e) => {
    statusEl.innerHTML =
      `<div class="err">❌ SDK script 로드 실패\n` +
      `흔한 원인:\n` +
      `1) 카카오 디벨로퍼스에서 현재 host(${location.host || 'file://'})를 Web 플랫폼에 등록 안 함\n` +
      `2) 네트워크 차단 (회사망/방화벽)\n` +
      `3) 키 오타 또는 비활성화된 키\n` +
      `→ 브라우저 DevTools(F12) → Console·Network 탭에서 dapi.kakao.com 응답 코드 확인하세요.</div>`;
  };
  document.head.appendChild(s);

  function initMap() {
    const container = document.getElementById('map');
    const map = new kakao.maps.Map(container, {
      center: new kakao.maps.LatLng(37.5665, 126.9780),
      level: 7
    });

    const recs = [
      { name: '종로구 사직동',   lat: 37.5759, lng: 126.9684, score: 87, price: '월세 60/40' },
      { name: '서대문구 연희동', lat: 37.5709, lng: 126.9322, score: 82, price: '월세 50/45' },
      { name: '성동구 행당동',   lat: 37.5577, lng: 127.0297, score: 79, price: '월세 55/50' },
      { name: '마포구 망원동',   lat: 37.5552, lng: 126.9075, score: 75, price: '월세 45/55' },
    ];

    recs.forEach(r => {
      const pos = new kakao.maps.LatLng(r.lat, r.lng);
      const marker = new kakao.maps.Marker({ map, position: pos, title: r.name });
      const iw = new kakao.maps.InfoWindow({
        content: `<div style="padding:8px 12px; font-size:13px; min-width:140px">
                    <b>${r.name}</b><br>종합점수 <b>${r.score}</b><br>${r.price}
                  </div>`
      });
      kakao.maps.event.addListener(marker, 'click', () => iw.open(map, marker));
    });

    new kakao.maps.Marker({
      map,
      position: new kakao.maps.LatLng(37.4979, 127.0276),
      title: '직장 (강남역)',
      image: new kakao.maps.MarkerImage(
        'https://t1.daumcdn.net/mapjsapi/images/2x/marker_red.png',
        new kakao.maps.Size(30, 42)
      )
    });

    statusEl.innerHTML = '<div class="ok">✅ 지도 초기화 완료</div>';
  }
</script>
</body>
</html>
