<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>비밀번호 찾기 — 집찾봇</title>
  <link rel="stylesheet" href="/static/auth.css" />
</head>
<body>
<div class="auth-container">

  <!-- 왼쪽 패널 -->
  <div class="auth-left">
    <div class="auth-icon-box">🏠</div>
    <h1 class="auth-app-title">집찾봇</h1>
    <p class="auth-app-sub">서울시 공공데이터로 찾는</p>
    <p class="auth-app-sub">나에게 딱 맞는 청년 주거지</p>
    <div class="auth-badge">🏆 서울시 빅데이터 경진대회</div>
    <div class="auth-feature-list" id="feature-list">
      <div class="auth-feature-item"><span>🔒</span><span>안전한 비밀번호 재설정</span></div>
      <div class="auth-feature-item"><span>📧</span><span>이메일로 재설정 링크 발송</span></div>
      <div class="auth-feature-item"><span>⚡</span><span>빠르고 간편한 인증 절차</span></div>
    </div>
  </div>

  <!-- 오른쪽 패널 -->
  <div class="auth-right">
    <div class="auth-card">

      <!-- STEP 1, 2: 이메일 + 코드 -->
      <div id="step12">
        <span class="forgot-emoji">🔐</span>
        <h2 class="auth-title" style="text-align:center">비밀번호 찾기</h2>
        <p class="auth-subtitle" style="text-align:center">
          가입한 이메일을 입력하면<br>재설정 코드를 보내드릴게요
        </p>

        <div id="error-msg" class="error-banner" style="display:none"></div>

        <label class="auth-label">가입한 이메일</label>
        <div class="auth-input-row">
          <input class="auth-input" id="email" type="email" placeholder="email@example.com" />
          <button class="send-btn" id="send-btn" onclick="handleSendCode()">코드 발송</button>
        </div>

        <!-- STEP 2: 코드 입력 (처음엔 숨김) -->
        <div id="step2-extra" style="display:none">
          <div class="code-sent-box">
            <span>📧</span>
            <span id="sent-email-text"></span>
          </div>
          <input class="code-input" id="code" placeholder="000000" maxlength="6" inputmode="numeric" />
          <div class="timer-row">
            <span class="timer" id="timer">🕐 05:00</span>
            <button class="resend-btn" onclick="handleResend()">재발송</button>
          </div>
          <button class="auth-btn" onclick="handleVerifyCode()">인증 완료 →</button>
        </div>
      </div>

      <!-- STEP 3: 새 비밀번호 -->
      <div id="step3" style="display:none">
        <span class="forgot-emoji">🔑</span>
        <h2 class="auth-title" style="text-align:center">새 비밀번호 설정</h2>
        <p class="auth-subtitle" style="text-align:center">
          이메일 인증이 완료됐어요!<br>새로운 비밀번호를 입력해주세요
        </p>

        <div id="error-msg-3" class="error-banner" style="display:none"></div>

        <label class="auth-label">새 비밀번호</label>
        <input class="auth-input" id="new-password" type="password" placeholder="8자 이상 입력하세요" />

        <label class="auth-label">새 비밀번호 확인</label>
        <input class="auth-input" id="new-password-2" type="password" placeholder="비밀번호를 다시 입력하세요" />

        <button class="auth-btn" onclick="handleResetPassword()">비밀번호 변경 완료</button>

        <div class="auth-footer">
          <a class="auth-footer-link" href="/login">로그인으로 돌아가기</a>
        </div>
      </div>

      <!-- 하단 링크 (STEP 1, 2 일 때만) -->
      <div id="bottom-links">
        <div class="auth-footer">
          생각났어요!
          <a class="auth-footer-link" href="/login">로그인으로 돌아가기</a>
        </div>
        <div class="auth-footer">
          계정이 없으신가요?
          <a class="auth-footer-link" href="/signup">회원가입</a>
        </div>
      </div>
    </div>
  </div>

</div>
<script>
  let step = 1;
  let timer = 300;
  let timerInterval = null;

  const errEl  = document.getElementById('error-msg');
  const errEl3 = document.getElementById('error-msg-3');

  function showErr(el, msg) {
    el.textContent = msg;
    el.style.display = 'block';
  }
  function clearErr(el) { el.style.display = 'none'; }

  function startTimer() {
    timer = 300;
    updateTimerDisplay();
    if (timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timer--;
      updateTimerDisplay();
      if (timer <= 0) clearInterval(timerInterval);
    }, 1000);
  }
  function updateTimerDisplay() {
    const m = String(Math.floor(timer / 60)).padStart(2, '0');
    const s = String(timer % 60).padStart(2, '0');
    document.getElementById('timer').textContent = `🕐 ${m}:${s}`;
  }

  async function handleSendCode() {
    const email = document.getElementById('email').value.trim();
    clearErr(errEl);
    if (!email)                         { showErr(errEl, '이메일을 입력해주세요'); return; }
    if (!email.includes('@'))           { showErr(errEl, '올바른 이메일 형식이 아닙니다'); return; }

    const btn = document.getElementById('send-btn');
    btn.disabled = true;
    try {
      const res  = await fetch('/password/send-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });
      const data = await res.json();
      if (res.ok) {
        step = 2;
        document.getElementById('sent-email-text').textContent = `${email} 로 코드를 보냈어요`;
        document.getElementById('step2-extra').style.display = 'block';
        document.getElementById('email').disabled = true;
        btn.textContent = '재발송';
        btn.disabled = false;
        startTimer();
      } else {
        showErr(errEl, data.detail || '이메일 전송에 실패했습니다');
        btn.disabled = false;
      }
    } catch (e) {
      showErr(errEl, '서버 연결 오류');
      btn.disabled = false;
    }
  }

  async function handleResend() {
    const email = document.getElementById('email').value.trim();
    try {
      await fetch('/password/send-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });
      document.getElementById('code').value = '';
      startTimer();
    } catch (e) {
      showErr(errEl, '재발송에 실패했습니다');
    }
  }

  async function handleVerifyCode() {
    const email = document.getElementById('email').value.trim();
    const code  = document.getElementById('code').value.trim();
    clearErr(errEl);
    if (!code || code.length !== 6) { showErr(errEl, '6자리 코드를 입력해주세요'); return; }

    try {
      const res = await fetch('/password/verify-code', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, code }),
      });
      const data = await res.json();
      if (res.ok) {
        if (timerInterval) clearInterval(timerInterval);
        document.getElementById('step12').style.display = 'none';
        document.getElementById('bottom-links').style.display = 'none';
        document.getElementById('step3').style.display = 'block';
        // 좌측 features 변경
        document.getElementById('feature-list').innerHTML = `
          <div class="auth-feature-item"><span>🔒</span><span>안전한 비밀번호 재설정</span></div>
          <div class="auth-feature-item"><span>✅</span><span>이메일 인증 완료</span></div>
        `;
      } else {
        showErr(errEl, data.detail || '코드가 올바르지 않습니다');
      }
    } catch (e) {
      showErr(errEl, '서버 연결 오류');
    }
  }

  async function handleResetPassword() {
    const email = document.getElementById('email').value.trim();
    const code  = document.getElementById('code').value.trim();
    const np    = document.getElementById('new-password').value;
    const np2   = document.getElementById('new-password-2').value;
    clearErr(errEl3);
    if (!np)                  { showErr(errEl3, '새 비밀번호를 입력해주세요'); return; }
    if (np.length < 8)        { showErr(errEl3, '8자 이상 입력해주세요'); return; }
    if (np !== np2)           { showErr(errEl3, '비밀번호가 일치하지 않습니다'); return; }

    try {
      const res = await fetch('/password/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, code, new_password: np }),
      });
      const data = await res.json();
      if (res.ok) {
        alert('비밀번호가 변경되었습니다!');
        location.href = '/login';
      } else {
        showErr(errEl3, data.detail || '비밀번호 변경에 실패했습니다');
      }
    } catch (e) {
      showErr(errEl3, '서버 연결 오류');
    }
  }

  // 코드 입력은 숫자만
  document.getElementById('code').addEventListener('input', (e) => {
    e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6);
  });
</script>
</body>
</html>
